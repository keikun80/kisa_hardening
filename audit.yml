# ==============================================================================
# KISA Linux/Unix 취약점 진단 및 리포트 생성 플레이북 (audit.yml)
# ==============================================================================

- name: Audit KISA Vulnerabilities on Target Hosts
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true

  roles:
    - role: kisa_audit
