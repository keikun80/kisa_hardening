# AWS EC2 환경 대상 인벤토리 설정 예시
# 실제 환경에 맞게 ansible_host 및 SSH 키/사용자명을 지정하세요.

[all:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
# ansible_ssh_private_key_file=~/.ssh/your-aws-key.pem

# ==========================================
# RedHat 계열 (Amazon Linux 2023, Fedora, RHEL, Rocky, CentOS)
# ==========================================
[amazon_linux]
# ec2-al2023-01 ansible_host=10.0.1.10 ansible_user=ec2-user

[fedora]
# ec2-fedora-01 ansible_host=10.0.1.11 ansible_user=fedora

[rhel]
# ec2-rhel-01 ansible_host=10.0.1.12 ansible_user=ec2-user

[rocky]
# ec2-rocky-01 ansible_host=10.0.1.13 ansible_user=rocky

[centos]
# ec2-centos-01 ansible_host=10.0.1.14 ansible_user=centos

[redhat_family:children]
amazon_linux
fedora
rhel
rocky
centos

# ==========================================
# Debian 계열 (Ubuntu, Debian)
# ==========================================
[ubuntu]
# ec2-ubuntu-01 ansible_host=10.0.2.10 ansible_user=ubuntu

[debian]
# ec2-debian-01 ansible_host=10.0.2.11 ansible_user=admin

[debian_family:children]
ubuntu
debian

# ==========================================
# BSD 계열 (FreeBSD)
# ==========================================
[freebsd]
# ec2-freebsd-01 ansible_host=10.0.3.10 ansible_user=ec2-user ansible_python_interpreter=/usr/local/bin/python3

[linux_servers:children]
redhat_family
debian_family

[target_servers:children]
linux_servers
freebsd
