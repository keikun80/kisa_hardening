---
# roles/kisa_hardening/defaults/main.yml

# 기본 플래그: 특정 도메인별 활성화 여부
enable_account_hardening: true
enable_filesystem_hardening: true
enable_services_hardening: true
enable_patch_hardening: false  # 기본값은 안전을 위해 false (선택 실행)
enable_log_hardening: true

# 백업 설정
backup_original_files: true

# 계정 보안 기본값
allowed_su_users:
  - ec2-user
  - ubuntu
  - rocky
  - fedora
  - centos
  - admin

# 시스템 계정 로그인 차단 목록
restricted_system_users:
  - daemon
  - bin
  - sys
  - adm
  - listen
  - nobody
  - nobody4
  - noaccess
  - diag
  - operator
  - games
  - gopher

# U-23: SUID/SGID 권한 제거 대상 주요 위험 바이너리 목록
risky_suid_binaries:
  - /usr/bin/rcp
  - /usr/bin/rlogin
  - /usr/bin/rsh
  - /usr/bin/rexec
  - /usr/bin/traceroute
  - /usr/sbin/traceroute
  - /usr/sbin/dump
  - /usr/sbin/restore
  - /usr/bin/lpr
  - /usr/bin/lprm
  - /usr/bin/lpc
  - /usr/sbin/lpc
  - /usr/bin/lp
  - /usr/bin/at
  - /usr/bin/atq
  - /usr/bin/atrm
