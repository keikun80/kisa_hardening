---
# U-27: r-command 사용 금지
# U-28: 접속 IP 및 포트 제한

# U-27: hosts.equiv 및 .rhosts 제거
- name: "[U-27] Remove /etc/hosts.equiv if exists"
  ansible.builtin.file:
    path: /etc/hosts.equiv
    state: absent
  tags: [U-27, filesystem]

- name: "[U-27] Remove root's .rhosts file if exists"
  ansible.builtin.file:
    path: /root/.rhosts
    state: absent
  tags: [U-27, filesystem]

